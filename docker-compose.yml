# ============================================
# Streamify — Docker Compose (Base)
# ============================================
# Usage:
#   Development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   Production:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================

services:
    # ---- Frontend (Nginx) ----
    frontend:
        build:
            context: .
            dockerfile: infra/docker/frontend.Dockerfile
        container_name: streamify-frontend
        ports:
            - "80:80"
        depends_on:
            backend:
                condition: service_healthy
        restart: unless-stopped
        networks:
            - streamify

    # ---- Backend (Spring Boot) ----
    backend:
        build:
            context: ./apps/backend-spring
            dockerfile: Dockerfile
        container_name: streamify-backend
        ports:
            - "8080:8080"
            - "8085:8085"
        env_file:
            - .env.docker
        environment:
            - SPRING_PROFILES_ACTIVE=prod
            - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/streamify
            - SPRING_DATASOURCE_USERNAME=streamify
            - SPRING_DATASOURCE_PASSWORD=streamify
            - SPRING_DATA_REDIS_HOST=redis
            - SPRING_DATA_REDIS_PORT=6379
            - CORS_ORIGIN=http://localhost
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    memory: 1.5G
                    cpus: "1.0"
                reservations:
                    memory: 512M
                    cpus: "0.25"
        restart: unless-stopped
        networks:
            - streamify

    # ---- PostgreSQL ----
    postgres:
        image: postgres:16-alpine
        container_name: streamify-postgres
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_DB=streamify
            - POSTGRES_USER=streamify
            - POSTGRES_PASSWORD=streamify
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U streamify -d streamify"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped
        networks:
            - streamify

    # ---- Redis ----
    redis:
        image: redis:7-alpine
        container_name: streamify-redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped
        networks:
            - streamify

# ---- Volumes ----
volumes:
    postgres_data:
        driver: local
    redis_data:
        driver: local
    traefik_certs:
        driver: local

# ---- Networks ----
networks:
    streamify:
        driver: bridge
